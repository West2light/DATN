name: Unity Build

on:
  push:
    branches:
      - networking-gcp
    paths:
      - Assets/**
      - Packages/**
      - ProjectSettings/**
      - .github/workflows/unity-build.yml
  workflow_dispatch:
    inputs:
      upload_to_gcs:
        description: Upload artifacts to the configured GCS artifact bucket.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_BUCKET: ${{ vars.GCP_ARTIFACT_BUCKET }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: gcp-preview
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Linux Dedicated Server
            target_platform: StandaloneLinux64
            method: BuildServer.BuildLinuxServer
            build_dir: Builds/LinuxServer
            archive_prefix: tank-mapf-server
            gcs_prefix: server
            expected_file: TankMapfServer.x86_64
          - name: WebGL Client
            target_platform: WebGL
            method: BuildWebClient.BuildWebGL
            build_dir: Builds/WebGL
            archive_prefix: tank-mapf-web
            gcs_prefix: web
            expected_file: index.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: ${{ matrix.target_platform }}
          buildMethod: ${{ matrix.method }}

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail

          expected_path="${{ matrix.build_dir }}/${{ matrix.expected_file }}"
          if [ ! -e "$expected_path" ]; then
            echo "Workspace root:"
            find . -maxdepth 2 -mindepth 1 -printf '%p\n' | sort

            echo "Builds tree:"
            if [ -d Builds ]; then
              find Builds -maxdepth 4 -printf '%p\n' | sort
            else
              echo "Builds directory does not exist."
            fi

            echo "::error::Expected build output not found: $expected_path"
            exit 1
          fi

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          archive="${{ matrix.archive_prefix }}-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" -C "${{ matrix.build_dir }}" .
          gcs_uri="gs://${ARTIFACT_BUCKET}/${{ matrix.gcs_prefix }}/${GITHUB_SHA}/$archive"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "gcs_uri=$gcs_uri" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_prefix }}-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate to Google Cloud
        if: ${{ (github.event_name == 'push' || inputs.upload_to_gcs == 'true') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.GCP_ARTIFACT_BUCKET != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: ${{ (github.event_name == 'push' || inputs.upload_to_gcs == 'true') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.GCP_ARTIFACT_BUCKET != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload artifact to GCS
        if: ${{ (github.event_name == 'push' || inputs.upload_to_gcs == 'true') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.GCP_ARTIFACT_BUCKET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage cp "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.gcs_uri }}"
          echo "Uploaded ${{ steps.package.outputs.gcs_uri }}"

      - name: Warn when GCS upload is skipped
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == '' || vars.GCP_ARTIFACT_BUCKET == '' }}
        shell: bash
        run: |
          echo "::warning::GCS upload skipped. Configure GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT, and GCP_ARTIFACT_BUCKET to enable deploy by release SHA."
