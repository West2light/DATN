name: Unity Build

on:
  push:
    branches:
      - networking-gcp
    paths:
      - Assets/**
      - Packages/**
      - ProjectSettings/**
      - .github/workflows/unity-build.yml
  workflow_dispatch:
    inputs:
      upload_to_gcs:
        description: Upload artifacts to the configured GCS artifact bucket.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_BUCKET: ${{ vars.GCP_ARTIFACT_BUCKET }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: gcp-preview
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Linux Dedicated Server
            target_platform: StandaloneLinux64
            method: BuildServer.BuildLinuxServer
            build_dir: Builds/LinuxServer
            archive_prefix: tank-mapf-server
            gcs_prefix: server
            expected_file: TankMapfServer.x86_64
          - name: WebGL Client
            target_platform: WebGL
            method: BuildWebClient.BuildWebGL
            build_dir: Builds/WebGL
            archive_prefix: tank-mapf-web
            gcs_prefix: web
            expected_file: index.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (WebGL image is large)
        if: ${{ matrix.target_platform == 'WebGL' }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Build ${{ matrix.name }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: ${{ matrix.target_platform }}
          buildMethod: ${{ matrix.method }}

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail

          expected_path="${{ matrix.build_dir }}/${{ matrix.expected_file }}"
          if [ ! -e "$expected_path" ]; then
            echo "Workspace root:"
            find . -maxdepth 2 -mindepth 1 -printf '%p\n' | sort

            echo "Builds tree:"
            if [ -d Builds ]; then
              find Builds -maxdepth 4 -printf '%p\n' | sort
            else
              echo "Builds directory does not exist."
            fi

            echo "::error::Expected build output not found: $expected_path"
            exit 1
          fi

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          archive="${{ matrix.archive_prefix }}-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" -C "${{ matrix.build_dir }}" .
          gcs_uri="gs://${ARTIFACT_BUCKET}/${{ matrix.gcs_prefix }}/${GITHUB_SHA}/$archive"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "gcs_uri=$gcs_uri" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_prefix }}-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate to Google Cloud
        if: ${{ (github.event_name == 'push' || inputs.upload_to_gcs == 'true') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.GCP_ARTIFACT_BUCKET != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: ${{ (github.event_name == 'push' || inputs.upload_to_gcs == 'true') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.GCP_ARTIFACT_BUCKET != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload artifact to GCS
        if: ${{ (github.event_name == 'push' || inputs.upload_to_gcs == 'true') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.GCP_ARTIFACT_BUCKET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage cp "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.gcs_uri }}"
          echo "Uploaded ${{ steps.package.outputs.gcs_uri }}"

      - name: Warn when GCS upload is skipped
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == '' || vars.GCP_ARTIFACT_BUCKET == '' }}
        shell: bash
        run: |
          echo "::warning::GCS upload skipped. Configure GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT, and GCP_ARTIFACT_BUCKET to enable deploy by release SHA."

  auto-deploy:
    name: Auto deploy server and WebGL
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/networking-gcp' }}
    environment: gcp-production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_ARTIFACT_BUCKET: ${{ vars.GCP_ARTIFACT_BUCKET }}
      GCP_VM_NAME: ${{ vars.GCP_VM_NAME || 'tank-mapf-server' }}
      GCP_STATIC_IP_NAME: ${{ vars.GCP_STATIC_IP_NAME || 'tank-mapf-ip' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      SESSION_CODE: ${{ secrets.TF_VAR_SERVER_SESSION_CODE }}
      MAP_FILE: ${{ vars.AUTO_DEPLOY_MAP_FILE || 'random-32-32-10.map' }}
      ALGORITHM: ${{ vars.AUTO_DEPLOY_ALGORITHM || 'AStar' }}
      MAX_PLAYERS: ${{ vars.AUTO_DEPLOY_MAX_PLAYERS || '8' }}

    steps:
      - name: Check required deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_ZONE \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT \
            GCP_ARTIFACT_BUCKET \
            SESSION_CODE
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for auto deploy."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve deployment targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail

          release_sha="$GITHUB_SHA"
          server_ip="$(
            gcloud compute addresses describe "$GCP_STATIC_IP_NAME" \
              --region "$GCP_REGION" \
              --format='value(address)'
          )"

          if [ -z "$server_ip" ]; then
            echo "::error::Could not resolve static IP address $GCP_STATIC_IP_NAME in $GCP_REGION."
            exit 1
          fi

          server_artifact="gs://${GCP_ARTIFACT_BUCKET}/server/${release_sha}/tank-mapf-server-${release_sha}.tar.gz"
          web_artifact="gs://${GCP_ARTIFACT_BUCKET}/web/${release_sha}/tank-mapf-web-${release_sha}.tar.gz"

          gcloud storage ls "$server_artifact" >/dev/null
          gcloud storage ls "$web_artifact" >/dev/null

          {
            echo "server_ip=$server_ip"
            echo "registry_base_url=https://${APP_DOMAIN}"
            echo "web_url=https://${APP_DOMAIN}"
            echo "server_artifact=$server_artifact"
            echo "web_artifact=$web_artifact"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy Linux dedicated server
        shell: bash
        env:
          SERVER_IP: ${{ steps.targets.outputs.server_ip }}
          SERVER_ARTIFACT: ${{ steps.targets.outputs.server_artifact }}
        run: |
          set -euo pipefail

          server_cmd="$(
            printf "sudo ARTIFACT_URI=%q RELEASE_SHA=%q PUBLIC_IP=%q SESSION_CODE=%q MAP_FILE=%q ALGORITHM=%q MAX_PLAYERS=%q /opt/tank-mapf/scripts/deploy-release.sh" \
              "$SERVER_ARTIFACT" \
              "$GITHUB_SHA" \
              "$SERVER_IP" \
              "$SESSION_CODE" \
              "$MAP_FILE" \
              "$ALGORITHM" \
              "$MAX_PLAYERS"
          )"

          gcloud compute ssh "$GCP_VM_NAME" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --command "$server_cmd"

      - name: Deploy WebGL client
        shell: bash
        env:
          WEB_ARTIFACT: ${{ steps.targets.outputs.web_artifact }}
        run: |
          set -euo pipefail

          web_cmd="$(
            printf "sudo WEB_ARTIFACT_URI=%q WEB_RELEASE_SHA=%q /opt/tank-mapf/scripts/deploy-web.sh" \
              "$WEB_ARTIFACT" \
              "$GITHUB_SHA"
          )"

          gcloud compute ssh "$GCP_VM_NAME" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --command "$web_cmd"

      - name: Smoke test registry and web
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS "${{ steps.targets.outputs.registry_base_url }}/create" | grep -qi 'tank mapf'
          curl -fsSI "${{ steps.targets.outputs.web_url }}"
          curl -fsS "${{ steps.targets.outputs.web_url }}/StreamingAssets/MapData/random-32-32-10.map" | grep -q '^type'
          curl -fsSI "${{ steps.targets.outputs.web_url }}/Build/WebGL.wasm.br"
          curl -fsSI "${{ steps.targets.outputs.web_url }}/Build/WebGL.data.br"
          curl -fsS "${{ steps.targets.outputs.web_url }}/build-manifest.json" | tee /tmp/web-build-manifest.json >/dev/null
          grep -q "${GITHUB_SHA}" /tmp/web-build-manifest.json

      - name: Print service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e

          gcloud compute ssh "$GCP_VM_NAME" --zone "$GCP_ZONE" --tunnel-through-iap --command "systemctl status tank-mapf-server.service --no-pager"
          gcloud compute ssh "$GCP_VM_NAME" --zone "$GCP_ZONE" --tunnel-through-iap --command "systemctl status tank-mapf-server-web.service --no-pager"
          gcloud compute ssh "$GCP_VM_NAME" --zone "$GCP_ZONE" --tunnel-through-iap --command "systemctl status tank-mapf-registry.service --no-pager"
          gcloud compute ssh "$GCP_VM_NAME" --zone "$GCP_ZONE" --tunnel-through-iap --command "journalctl -u tank-mapf-server.service -n 100 --no-pager"
          gcloud compute ssh "$GCP_VM_NAME" --zone "$GCP_ZONE" --tunnel-through-iap --command "journalctl -u tank-mapf-server-web.service -n 100 --no-pager"
          gcloud compute ssh "$GCP_VM_NAME" --zone "$GCP_ZONE" --tunnel-through-iap --command "journalctl -u tank-mapf-registry.service -n 100 --no-pager"
